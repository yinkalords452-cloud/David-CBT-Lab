<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>David CBT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background: linear-gradient(
                135deg,
                #071952,
                #088395
            );
        }

        .container {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.3);
        }

        .logo {

            width: 80px;

            height: 80px;

            background: #071952;

            color: white;

            border-radius: 50%;

            margin: auto;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 32px;

            font-weight: bold;
        }

        h1 {

            color: #071952;

            margin-bottom: 5px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }

        .button {

            display: block;

            width: 100%;

            padding: 16px;

            margin: 15px 0;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;
        }

        .student {

            background: #088395;
        }

        .register {

            background: #f39c12;
        }

        .admin {

            background: #071952;
        }

        .button:hover {

            opacity: 0.85;
        }

        .footer {

            margin-top: 25px;

            color: #777;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        D
    </div>


    <h1>
        DAVID CBT
    </h1>


    <p class="subtitle">
        Online Examination System
    </p>


    <!-- STUDENT LOGIN -->

    <a href="student-login.html"
       class="button student">

        👨‍🎓 Student Login

    </a>


    <!-- NEW STUDENT REGISTRATION -->

    <a href="student-register.html"
       class="button register">

        📝 New Student Registration

    </a>


    <!-- ADMIN LOGIN -->

    <a href="admin-login.html"
       class="button admin">

        👨‍💼 Admin Login

    </a>


    <p class="footer">

        Secure • Simple • Online Examination

    </p>


</div>


</body>

    </html>
