<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - David CBT</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #071952,
                    #088395
                );
        }


        .login-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.3);
        }


        .logo {

            width: 65px;

            height: 65px;

            background: #088395;

            color: white;

            border-radius: 50%;

            margin: 0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 28px;

            font-weight: bold;
        }


        h1 {

            text-align: center;

            color: #071952;

            margin-bottom: 5px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #088395;
        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 25px;

            border: none;

            border-radius: 9px;

            background: #088395;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #066b78;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #071952;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        D
    </div>


    <h1>
        Student Login
    </h1>


    <p class="subtitle">
        Login to take your examination
    </p>


    <form>

        <label>
            Username
        </label>

        <input
            type="text"
            placeholder="Enter your username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">

            🔐 Login

        </button>

    </form>


    <a href="index.html"
       class="back">

        ← Back to Home

    </a>


</div>


</body>

</html>
