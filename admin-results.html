<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Results - David CBT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #071952;
            color: white;
            padding: 18px;
        }

        .header {
            max-width: 1000px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #088395;
            padding: 9px 13px;
            border-radius: 7px;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 25px 15px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #071952;
        }

        .result {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .student {
            font-size: 18px;
            font-weight: bold;
            color: #071952;
        }

        .subject {
            margin-top: 8px;
            font-weight: bold;
        }

        .score {
            margin-top: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #088395;
        }

        .date {
            margin-top: 8px;
            color: #777;
        }

        .empty,
        .loading {
            text-align: center;
            color: #777;
            padding: 25px;
        }
    </style>

</head>


<body>

<header>

    <div class="header">

        <div class="brand">
            👨‍💼 DAVID CBT ADMIN
        </div>

        <a
            href="admin-dashboard.html"
            class="back">

            ← Dashboard

        </a>

    </div>

</header>


<main>

    <div class="box">

        <h1>
            📊 Student Results
        </h1>

        <div id="results">

            <p class="loading">
                Loading results...
            </p>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

async function loadResults() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "admin-login.html";

        return;
    }


    const {
        data: profile,
        error: profileError
    } = await supabaseClient

        .from("profiles")

        .select("role")

        .eq("id", session.user.id)

        .single();


    if (
        profileError ||
        !profile ||
        profile.role !== "admin"
    ) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin-login.html";

        return;
    }


    const {
        data: results,
        error
    } = await supabaseClient

        .from("results")

        .select(
            "user_id, subject, score, total_questions, created_at"
        )

        .order("created_at", {
            ascending: false
        });


    const container =
        document.getElementById("results");


    if (error) {

        container.innerHTML = `
            <p class="empty">
                Unable to load results.
            </p>
        `;

        return;
    }


    if (!results || results.length === 0) {

        container.innerHTML = `
            <p class="empty">
                No student results yet.
            </p>
        `;

        return;
    }


    container.innerHTML = "";


    results.forEach(function(result) {

        const percentage =
            Math.round(
                (result.score /
                result.total_questions) * 100
            );


        const date =
            new Date(
                result.created_at
            ).toLocaleString();


        const div =
            document.createElement("div");


        div.className =
            "result";


        div.innerHTML = `

            <div class="student">
                👨‍🎓 Student ID:
                ${result.user_id}
            </div>

            <div class="subject">
                📚 Subject:
                ${result.subject}
            </div>

            <div class="score">
                Score:
                ${result.score}
                /
                ${result.total_questions}
                (${percentage}%)
            </div>

            <div class="date">
                🕒 ${date}
            </div>

        `;


        container.appendChild(div);

    });

}


loadResults();

</script>


</body>

</html>
