<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - David CBT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: linear-gradient(
                135deg,
                #071952,
                #000000
            );
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.4);
        }

        .logo {
            width: 70px;
            height: 70px;

            background: #071952;

            color: white;

            border-radius: 50%;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #071952;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #071952;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 25px;

            border: none;

            border-radius: 9px;

            background: #071952;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

        .error {
            display: block;

            background: #ffe5e5;

            color: #b00020;
        }

        .success {
            display: block;

            background: #e5ffe9;

            color: #08752b;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #071952;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        A
    </div>

    <h1>
        Admin Login
    </h1>

    <p class="subtitle">
        David CBT Administration
    </p>


    <form id="adminLoginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="Enter admin email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
        >


        <button
            id="loginButton"
            type="submit">

            🔐 Admin Login

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="index.html"
        class="back">

        ← Back to Home

    </a>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const form =
    document.getElementById("adminLoginForm");

const message =
    document.getElementById("message");

const loginButton =
    document.getElementById("loginButton");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Checking...";

        message.className =
            "message";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {
                throw error;
            }


            const user =
                data.user;


            const { data: profile, error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .select("username, role")
                    .eq("id", user.id)
                    .single();


            if (profileError) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Your account profile could not be found."
                );
            }


            if (profile.role !== "admin") {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Access denied. This account is not an administrator."
                );
            }


            showMessage(
                "Login successful! Opening Admin Dashboard...",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "admin-dashboard.html";

            }, 1000);


        } catch (error) {

            showMessage(
                error.message ||
                "Login failed. Please check your details.",
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "🔐 Admin Login";
        }

    }
);

</script>


</body>

</html>
